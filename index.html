<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>中３　計算テスト練習アプリ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <style>
      :root {
        --bg: #f4f1e8;
        --bg-soft: #ece7d9;
        --surface: #fffdf7;
        --card: #ffffff;
        --ink: #26303e;
        --ink-2: #5d6875;
        --ink-3: #8b94a0;
        --line: #e2dbc9;
        --line-strong: #cfc6ae;
        --accent: #cf3524;
        --accent-deep: #a92a1c;
        --accent-soft: #fbeae6;
        --slate: #40618f;
        --slate-soft: #e7edf5;
        --teal: #1e7a6c;
        --teal-soft: #e2f1ec;
        --gold: #b07d1e;
        --shadow: 0 1px 2px rgba(60, 48, 20, .06), 0 8px 24px -12px rgba(60, 48, 20, .18);
        --radius: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14171d;
          --bg-soft: #1a1e26;
          --surface: #1d212b;
          --card: #212633;
          --ink: #ece8dc;
          --ink-2: #a9b1bf;
          --ink-3: #7d8694;
          --line: #313947;
          --line-strong: #454f61;
          --accent: #ff6a55;
          --accent-deep: #ff8a76;
          --accent-soft: #3d2320;
          --slate: #8fb0dd;
          --slate-soft: #26334a;
          --teal: #4cc2ae;
          --teal-soft: #1d3330;
          --gold: #d9a94e;
          --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 26px -14px rgba(0,0,0,.6);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
        line-height: 1.75;
        font-size: 16px;
      }
      button { font-family: inherit; cursor: pointer; }
      .wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 56px; }

      /* ---------- home header ---------- */
      .home-head { margin: 6px 0 18px; }
      .home-head h1 { font-size: 1.55rem; font-weight: 800; margin: 0 0 2px; letter-spacing: .02em; }
      .home-head p { margin: 0; color: var(--ink-2); font-size: .92rem; }
      .summary {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0 20px;
      }
      .stat {
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
        padding: 12px 14px; box-shadow: var(--shadow);
      }
      .stat .num { font-size: 1.5rem; font-weight: 800; line-height: 1.25; }
      .stat .num small { font-size: .85rem; color: var(--ink-2); font-weight: 500; }
      .stat .lbl { font-size: .78rem; color: var(--ink-2); margin-top: 2px; }
      .stat.weak .num { color: var(--accent); }
      .overall-bar { height: 8px; background: var(--bg-soft); border-radius: 99px; overflow: hidden; margin-top: 8px; }
      .overall-bar i { display: block; height: 100%; background: var(--teal); border-radius: 99px; transition: width .4s ease; }

      /* ---------- mode cards ---------- */
      .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 26px; }
      .mode-btn {
        text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
        border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); min-height: 44px;
        transition: transform .12s ease, border-color .12s ease;
      }
      .mode-btn:hover { border-color: var(--line-strong); transform: translateY(-1px); }
      .mode-btn:active { transform: translateY(0); }
      .mode-btn .m-title { font-size: 1.08rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
      .mode-btn .m-desc { font-size: .85rem; color: var(--ink-2); margin-top: 4px; line-height: 1.6; }
      .mode-btn .m-badge {
        margin-left: auto; background: var(--accent); color: #fff; font-size: .78rem; font-weight: 700;
        border-radius: 99px; padding: 1px 10px; line-height: 1.7;
      }
      .mode-btn.drill .m-title::before { content: "🎲"; }
      .mode-btn.weak .m-title::before { content: "✕"; color: var(--accent); font-weight: 800; }
      .mode-btn:disabled { opacity: .55; cursor: default; transform: none; }

      /* ---------- week grid ---------- */
      .section-title { font-size: 1.05rem; font-weight: 800; margin: 0 0 12px; display: flex; align-items: baseline; gap: 10px; }
      .section-title span { font-size: .8rem; color: var(--ink-3); font-weight: 500; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
      .week-card {
        text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
        padding: 14px 16px 13px; color: var(--ink); box-shadow: var(--shadow); min-height: 44px;
        transition: transform .12s ease, border-color .12s ease; width: 100%;
      }
      .week-card:hover { border-color: var(--line-strong); transform: translateY(-1px); }
      .week-card .wk-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
      .week-card .wk-num { font-size: 1.3rem; font-weight: 800; }
      .week-card .wk-num small { font-size: .8rem; font-weight: 700; color: var(--ink-2); margin-right: 2px; }
      .score-chip {
        font-size: .8rem; font-weight: 800; border-radius: 99px; padding: 1px 10px; line-height: 1.8;
        background: var(--teal-soft); color: var(--teal); white-space: nowrap;
      }
      .score-chip.perfect { background: var(--accent); color: #fff; }
      .score-chip.none { background: var(--bg-soft); color: var(--ink-3); font-weight: 500; }
      .week-card .wk-topic { font-size: .92rem; font-weight: 700; margin-top: 2px; }
      .week-card .wk-title { font-size: .74rem; color: var(--ink-3); line-height: 1.5; margin-top: 1px;
        display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
      .wk-bar { height: 6px; background: var(--bg-soft); border-radius: 99px; overflow: hidden; margin-top: 10px; }
      .wk-bar i { display: block; height: 100%; background: var(--teal); border-radius: 99px; }
      .wk-meta { display: flex; justify-content: space-between; font-size: .76rem; color: var(--ink-2); margin-top: 6px; }
      .wk-meta .wk-weak { color: var(--accent); font-weight: 700; }

      .reset-zone { margin-top: 30px; text-align: center; }
      .reset-btn {
        background: none; border: none; color: var(--ink-3); font-size: .82rem; text-decoration: underline;
        text-underline-offset: 3px; padding: 10px 14px; min-height: 44px;
      }
      .reset-btn.confirm { color: var(--accent); font-weight: 700; text-decoration: none;
        border: 1px solid var(--accent); border-radius: 99px; padding: 8px 18px; }

      /* ---------- quiz ---------- */
      .quiz-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
      .quit-btn {
        background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); border-radius: 99px;
        padding: 6px 16px; font-size: .85rem; font-weight: 700; min-height: 40px; flex: none;
      }
      .quiz-progress { flex: 1; }
      .quiz-progress .qp-label { display: flex; justify-content: space-between; font-size: .8rem; color: var(--ink-2); margin-bottom: 5px; }
      .quiz-progress .qp-label b { color: var(--ink); }
      .qp-bar { height: 8px; background: var(--bg-soft); border-radius: 99px; overflow: hidden; }
      .qp-bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
      .q-card {
        background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
        padding: 22px 22px 20px;
      }
      .q-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
      .q-tag { font-size: .78rem; font-weight: 700; background: var(--bg-soft); color: var(--ink-2);
        border-radius: 99px; padding: 2px 11px; line-height: 1.8; }
      .q-tag.points { background: var(--accent-soft); color: var(--accent); }
      .q-body { font-size: 1.06rem; line-height: 2; overflow-x: auto; overflow-y: hidden; padding-bottom: 2px; }
      .q-body .katex { font-size: 1.05em; }
      .katex-display { margin: .4em 0; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
      .sublist { margin-top: .35em; display: grid; gap: .3em; }
      .subitem { display: flex; gap: .6em; align-items: flex-start; }
      .sublabel { font-weight: 800; color: var(--accent); flex: none; min-width: 2.2em; }
      .subbody { flex: 1; min-width: 0; }
      .fbox {
        display: inline-block; border: 1.6px solid var(--ink-2); border-radius: 4px; padding: 0 .38em;
        min-width: 1.7em; text-align: center; line-height: 1.45; font-weight: 700; background: var(--surface);
        vertical-align: baseline; margin: 0 .08em;
      }
      .texraw { font-family: ui-monospace, monospace; font-size: .88em; background: var(--bg-soft);
        border-radius: 6px; padding: 0 .3em; word-break: break-all; }

      .answer-zone { margin-top: 20px; }
      .reveal-btn {
        width: 100%; min-height: 54px; border-radius: 12px; border: 2px dashed var(--line-strong);
        background: var(--bg); color: var(--ink-2); font-size: 1rem; font-weight: 700;
        transition: border-color .12s ease, color .12s ease;
      }
      .reveal-btn:hover { border-color: var(--accent); color: var(--accent); }
      .answer-box {
        border: 1px solid var(--teal); background: var(--teal-soft); border-radius: 12px; padding: 14px 18px 12px;
      }
      .answer-box .a-label { font-size: .78rem; font-weight: 800; color: var(--teal); letter-spacing: .06em; margin-bottom: 4px; }
      .answer-box .a-body { font-size: 1.05rem; line-height: 2; overflow-x: auto; overflow-y: hidden; }
      .mark-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
      .mark-btn {
        min-height: 60px; border-radius: 12px; font-size: 1.35rem; font-weight: 800; border: 2px solid;
        display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--card);
        transition: transform .1s ease, background .1s ease;
      }
      .mark-btn small { font-size: .82rem; font-weight: 700; }
      .mark-btn.ok { color: var(--accent); border-color: var(--accent); }
      .mark-btn.ok:hover, .mark-btn.ok:active { background: var(--accent); color: #fff; }
      .mark-btn.ng { color: var(--slate); border-color: var(--slate); }
      .mark-btn.ng:hover, .mark-btn.ng:active { background: var(--slate); color: #fff; }
      .mark-btn:active { transform: scale(.98); }
      .marked-note { text-align: center; font-size: .9rem; color: var(--ink-2); margin-top: 14px; min-height: 1.4em; }
      .marked-note b.ok { color: var(--accent); }
      .marked-note b.ng { color: var(--slate); }

      /* ---------- result ---------- */
      .result-card {
        background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
        padding: 28px 22px; text-align: center;
      }
      .result-card .r-label { font-size: .9rem; color: var(--ink-2); font-weight: 700; }
      .result-score { font-size: 3.4rem; font-weight: 800; line-height: 1.2; margin: 6px 0 2px; }
      .result-score small { font-size: 1.1rem; color: var(--ink-2); font-weight: 500; }
      .result-score .perfect { color: var(--accent); }
      .result-sub { color: var(--ink-2); font-size: .92rem; }
      .review { margin-top: 22px; display: grid; gap: 10px; text-align: left; }
      .review-item {
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px;
        display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: .95rem;
      }
      .review-mark { font-size: 1.25rem; font-weight: 800; line-height: 1.5; }
      .review-mark.ok { color: var(--accent); }
      .review-mark.ng { color: var(--slate); }
      .review-q { line-height: 1.9; overflow-x: auto; overflow-y: hidden; }
      .review-a { grid-column: 2; color: var(--ink-2); font-size: .88rem; line-height: 1.9; overflow-x: auto; overflow-y: hidden; }
      .review-a::before { content: "答え："; font-weight: 700; color: var(--teal); }
      .result-actions { display: flex; gap: 12px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
      .btn {
        min-height: 50px; border-radius: 99px; padding: 10px 26px; font-size: .98rem; font-weight: 800;
        border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
      }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .btn.primary:hover { background: var(--accent-deep); }

      .empty-note {
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
        padding: 26px 20px; text-align: center; color: var(--ink-2); box-shadow: var(--shadow);
      }
      .empty-note .big { font-size: 1.6rem; margin-bottom: 6px; }
      .hidden { display: none !important; }
      .foot-note { margin-top: 34px; text-align: center; font-size: .76rem; color: var(--ink-3); }

      @media (max-width: 560px) {
        .wrap { padding: 14px 12px 48px; }
        .modes { grid-template-columns: 1fr; }
        .grid { grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 10px; }
        .summary { gap: 8px; }
        .stat { padding: 10px 11px; }
        .stat .num { font-size: 1.25rem; }
        .q-card { padding: 18px 15px 16px; }
        .q-body { font-size: 1rem; }
        .result-score { font-size: 2.7rem; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <main class="wrap">

      <!-- ======== ホーム ======== -->
      <section id="view-home">
        <div class="home-head">
          <h1>中３　計算テスト</h1>
          <p>中3数学・全42週 143問（各週100点満点）／ 答えを見て、自分で ○× を付ける練習アプリ</p>
        </div>

        <div class="summary">
          <div class="stat">
            <div class="num"><span id="st-done">0</span><small> / 143問</small></div>
            <div class="lbl">解いた問題</div>
            <div class="overall-bar"><i id="st-bar" style="width:0%"></i></div>
          </div>
          <div class="stat">
            <div class="num"><span id="st-rate">―</span></div>
            <div class="lbl">正解率（自己採点）</div>
          </div>
          <div class="stat weak">
            <div class="num"><span id="st-weak">0</span><small> 問</small></div>
            <div class="lbl">苦手（×）の問題</div>
          </div>
        </div>

        <div class="modes">
          <button class="mode-btn drill" id="btn-drill" type="button">
            <span class="m-title">ランダムドリル</span>
            <div class="m-desc">全143問からランダムに10問。腕試しやテスト前の総仕上げに。</div>
          </button>
          <button class="mode-btn weak" id="btn-weak" type="button">
            <span class="m-title">苦手だけ復習 <span class="m-badge hidden" id="weak-badge"></span></span>
            <div class="m-desc">× を付けた問題だけを集めて出題します。</div>
          </button>
        </div>

        <h2 class="section-title">週ごとテスト <span>週を選んでスタート（各週100点満点）</span></h2>
        <div class="grid" id="week-grid"></div>

        <div class="reset-zone">
          <button class="reset-btn" id="btn-reset" type="button">記録をすべてリセット</button>
        </div>
        <p class="foot-note">進捗はこのブラウザ内に保存されます（端末・ブラウザごとに記録されます）。</p>
      </section>

      <!-- ======== クイズ ======== -->
      <section id="view-quiz" class="hidden">
        <div class="quiz-top">
          <button class="quit-btn" id="btn-quit" type="button">← やめる</button>
          <div class="quiz-progress">
            <div class="qp-label"><span id="qp-title"></span><span><b id="qp-now">1</b> / <span id="qp-total">5</span> 問</span></div>
            <div class="qp-bar"><i id="qp-bar" style="width:0%"></i></div>
          </div>
        </div>
        <div class="q-card">
          <div class="q-meta">
            <span class="q-tag" id="q-where"></span>
            <span class="q-tag points" id="q-points"></span>
            <span class="q-tag hidden" id="q-prev"></span>
          </div>
          <div class="q-body" id="q-body"></div>
          <div class="answer-zone">
            <button class="reveal-btn" id="btn-reveal" type="button">答えを見る</button>
            <div id="answer-area" class="hidden">
              <div class="answer-box">
                <div class="a-label">答え</div>
                <div class="a-body" id="a-body"></div>
              </div>
              <div class="mark-row">
                <button class="mark-btn ok" id="btn-ok" type="button">○ <small>正解</small></button>
                <button class="mark-btn ng" id="btn-ng" type="button">× <small>不正解</small></button>
              </div>
            </div>
            <div class="marked-note" id="marked-note"></div>
          </div>
        </div>
      </section>

      <!-- ======== 結果 ======== -->
      <section id="view-result" class="hidden">
        <div class="result-card">
          <div class="r-label" id="r-label"></div>
          <div class="result-score" id="r-score"></div>
          <div class="result-sub" id="r-sub"></div>
          <div class="review" id="r-review"></div>
          <div class="result-actions">
            <button class="btn" id="btn-again" type="button">もう一度</button>
            <button class="btn primary" id="btn-home" type="button">週一覧へ戻る</button>
          </div>
        </div>
      </section>

      <!-- ======== 空状態 ======== -->
      <section id="view-empty" class="hidden">
        <div class="empty-note">
          <div class="big">🎉</div>
          <p id="empty-text">まだ × の問題がありません。<br />週ごとテストやランダムドリルで × が付いた問題が、ここに集まります。</p>
          <div class="result-actions">
            <button class="btn primary" id="btn-empty-home" type="button">週一覧へ戻る</button>
          </div>
        </div>
      </section>

    </main>

    <script>
      "use strict";

title":"中３計算テスト 39（後期第17週）","topic":"数学基礎講座 II［積分］","questions":[{"q":"次の定積分の値を求めよ。 \\begin{enumerate} \\item[(i)] $\\int_{-2}^{2}(x-2)^2\\,dx$ \\item[(ii)] $\\int_{0}^{3}|x-1|\\,dx$","points":40,"a":"\\begin{enumerate} \\item[(i)] $\\mathbf{\\frac{64}{3}}$ \\item[(ii)] $\\mathbf{\\frac{5}{2}}$"},{"q":"次の曲線，または，直線によって囲まれた部分の面積 $S$ を求めよ。 \\begin{enumerate} \\item[(i)] $y=x^2-x-2$，$x$ 軸 \\item[(ii)] $y=x^2-x+1$，$y=-x^2+2$","points":40,"a":"\\begin{enumerate} \\item[(i)] $\\mathbf{S=\\frac{9}{2}}$ \\item[(ii)] $\\mathbf{S=\\frac{9}{8}}$"},{"q":"$\\int_{a}^{x}f(t)\\,dt=x^2-6x+5$ を満たす関数 $f(x)$，及び $a$ の値を求めよ。","points":20,"a":"$\\mathbf{f(x)=2x-6,\\ a=1,\\ 5}$"}]},{"week":40,"title":"中３計算テスト 40（後期第18週）","topic":"数学基礎講座 II［平面ベクトル］","questions":[{"q":"$\\vec{a}=(-1,2)$ とする。$\\vec{a}$ と同じ向きに平行な単位ベクトルを求めよ。","points":20,"a":"$\\mathbf{\\left(-\\frac{\\sqrt{5}}{5},\\ \\frac{2\\sqrt{5}}{5}\\right)}$"},{"q":"一辺の長さが $2$ である正三角形 ABC において，次の二つのベクトルの内積を求めよ。ただし，点 M は辺 BC の中点である。 \\begin{enumerate} \\item[(i)] $\\vec{AB}\\cdot\\vec{BC}$ \\item[(ii)] $\\vec{BM}\\cdot\\vec{CM}$","points":40,"a":"\\begin{enumerate} \\item[(i)] $\\mathbf{-2}$ \\item[(ii)] $\\mathbf{-1}$"},{"q":"$|\\vec{a}|=4$，$|\\vec{b}|=3$，$|\\vec{a}+\\vec{b}|=2$ であるとき，次の各問に答えよ。 \\begin{enumerate} \\item[(i)] $\\vec{a}\\cdot\\vec{b}$ の値を求めよ。 \\item[(ii)] $|\\vec{a}-\\vec{b}|$ を求めよ。","points":40,"a":"\\begin{enumerate} \\item[(i)] $\\mathbf{-\\frac{21}{2}}$ \\item[(ii)] $\\mathbf{\\sqrt{46}}$"}]},{"week":41,"title":"中３計算テスト 41（後期第19週）","topic":"数学基礎講座 II［平面ベクトル］","questions":[{"q":"三点 A$(1,2)$，B$(3,4)$，C$(6,6)$ を頂点とする三角形の重心の座標を求めよ。","points":20,"a":"$\\mathbf{\\left(\\frac{10}{3},\\ 4\\right)}$"},{"q":"$\\vec{a}=(2,p)$，$\\vec{b}=(p+1,1)$ に対して，次の各条件が成立するような実数 $p$ の値を求めよ。 \\begin{enumerate} \\item[(i)] $\\vec{a}\\parallel\\vec{b}$ \\item[(ii)] $|\\vec{a}-\\vec{b}|=|\\vec{a}+\\vec{b}|$","points":40,"a":"\\begin{enumerate} \\item[(i)] $\\mathbf{p=1,\\ -2}$ \\item[(ii)] $\\mathbf{p=-\\frac{2}{3}}$"},{"q":"$\\triangle$OAB において，辺 OA の中点を M，辺 OB を $3:1$ に内分する点を N とし，AN，BM の交点を P とする。$\\vec{OA}=\\vec{a}$，$\\vec{OB}=\\vec{b}$ とするとき，次の各問に答えよ。 \\begin{enumerate} \\item[(i)] AP：NP $=t:(1-t)$ として，$\\vec{OP}$ を $\\vec{a}$，$\\vec{b}$ で表せ。 \\item[(ii)] $t$ を用いずに，$\\vec{OP}$ を $\\vec{a}$，$\\vec{b}$ だけで表せ。","points":40,"a":"\\begin{enumerate} \\item[(i)] $\\mathbf{\\vec{OP}=(1-t)\\vec{a}+\\frac{3}{4}t\\vec{b}}$ \\item[(ii)] $\\mathbf{\\vec{OP}=\\frac{1}{5}\\vec{a}+\\frac{3}{5}\\vec{b}}$"}]},{"week":42,"title":"中３計算テスト 42（後期第20週）","topic":"数学基礎講座 II［積分］","questions":[{"q":"次の関数 $F(x)$ の極大値，及び極小値をとる $x$ の値をそれぞれ求めよ（$x$ の値のみでよい）。 \\[ F(x)=\\int_{x}^{2}(t^2-2t)\\,dt \\]","points":20,"a":"極大値：$\\mathbf{x=2}$ のとき，極小値：$\\mathbf{x=0}$ のとき"},{"q":"次の等式を満たす整関数 $f(x)$，及び定数 $a$ の値を求めよ。 \\[ \\int_{1}^{x}tf(t)\\,dt=-x^3+ax^2+a \\]","points":20,"a":"$\\mathbf{f(x)=-3x+1,\\ a=\\frac{1}{2}}$"},{"q":"曲線 $y=x^3-6x^2+7x-5$ がある。以下の設問に答えよ。 \\begin{enumerate} \\item[(i)] 曲線 $y=x^3-6x^2+7x-5$ 上の点 $(1,-3)$ における接線の方程式を求めよ。 \\item[(ii)] (i)で求めた接線と曲線 $y=x^3-6x^2+7x-5$ の交点の座標を求めよ。 \\item[(iii)] (i)で求めた接線と曲線 $y=x^3-6x^2+7x-5$ で囲まれた図形の面積 $S$ を求めよ。","points":60,"a":"\\begin{enumerate} \\item[(i)] $\\mathbf{y=-2x-1}$ \\item[(ii)] $\\mathbf{(4,\\ -9)}$ \\item[(iii)] $\\mathbf{S=\\frac{27}{4}}$"}]},{"week":43,"title":"中３計算テスト 43（後期第21週）","topic":"数学基礎講座 I・II［総合］","questions":[{"q":"$x$ についての不等式 $x+2\\geqq\\frac{3}{x}$ を解け。","points":20,"a":"$\\mathbf{-3\\leqq x<0,\\ 1\\leqq x}$"},{"q":"次の各問に答えよ。 \\begin{enumerate} \\item[(i)] $\\vec{a}=(-2,1,2)$，$\\vec{b}=(4,1,-1)$ のなす角 $\\theta$ を求めよ。 \\item[(ii)] $\\vec{a}=(1,0,1)$，$\\vec{b}=(2,2,1)$ の両方に垂直な単位ベクトルを求めよ。","points":40,"a":"\\begin{enumerate} \\item[(i)] $\\mathbf{\\theta=\\frac{3}{4}\\pi}$ \\item[(ii)] $\\mathbf{\\left(\\frac{2}{3}, -\\frac{1}{3}, -\\frac{2}{3}\\right), \\left(-\\frac{2}{3}, \\frac{1}{3}, \\frac{2}{3}\\right)}$"},{"q":"箱の中に $1$ から $10$ までの数字が書かれた計 $10$ 枚のカードがある。この中から $3$ 枚を一度に取り出すとき，次の確率を求めよ。 \\begin{enumerate} \\item[(i)] 最大の数が $7$ 以下で，最小の数が $3$ 以上である確率 \\item[(ii)] 最大の数が $8$ 以上で，最小の数が $2$ 以下である確率","points":40,"a":"\\begin{enumerate} \\item[(i)] $\\mathbf{\\frac{1}{12}}$ \\item[(ii)] $\\mathbf{\\frac{13}{40}}$"}]}]};

      /* ================= 保存（localStorage） ================= */
      var LS_KEY = "keisanPractice.v1";
      var store = { marks: {}, scores: {} };
      try {
        var raw = localStorage.getItem(LS_KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && typeof parsed === "object") {
            store.marks = parsed.marks || {};
            store.scores = parsed.scores || {};
          }
        }
      } catch (e) { /* 読み込み失敗時は空で開始 */ }
      function save() {
        try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) { /* 保存不可環境では無視 */ }
      }
      function qid(wi, qi) { return DATA.weeks[wi].week + "-" + (qi + 1); }

      /* ================= TeX → HTML ================= */
      function escapeHtml(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      function katexHtml(tex, display) {
        if (window.katex) {
          try {
            return window.katex.renderToString(tex, {
              displayMode: !!display, throwOnError: false, strict: false, trust: false
            });
          } catch (e) { /* fall through */ }
        }
        return '<span class="texraw">' + escapeHtml((display ? "\\[" : "$") + tex + (display ? "\\]" : "$")) + "</span>";
      }
      function renderTextSegment(seg) {
        var boxes = [];
        var s = seg.replace(/\\fbox\{([^{}]*)\}/g, function (m, inner) {
          boxes.push('<span class="fbox">' + escapeHtml(inner) + "</span>");
          return "\u0002" + (boxes.length - 1) + "\u0003";
        });
        s = escapeHtml(s);
        s = s.replace(/\\\\/g, "<br />");
        s = s.replace(/\\qquad/g, "　　").replace(/\\quad/g, "　").replace(/\\,/g, " ");
        s = s.replace(/\\ /g, " ");
        s = s.replace(/\u0002(\d+)\u0003/g, function (m, n) { return boxes[+n]; });
        return s;
      }
      function renderInline(str) {
        var out = "", buf = "", i = 0;
        function flush() { if (buf) { out += renderTextSegment(buf); buf = ""; } }
        while (i < str.length) {
          if (str.substr(i, 2) === "\\[") {
            var endD = str.indexOf("\\]", i + 2);
            if (endD < 0) { buf += str[i]; i++; continue; }
            flush();
            out += katexHtml(str.slice(i + 2, endD), true);
            i = endD + 2;
          } else if (str[i] === "$") {
            var endI = str.indexOf("$", i + 1);
            if (endI < 0) { buf += str[i]; i++; continue; }
            flush();
            out += katexHtml(str.slice(i + 1, endI), false);
            i = endI + 1;
          } else { buf += str[i]; i++; }
        }
        flush();
        return out;
      }
      var ROMAN = ["(i)", "(ii)", "(iii)", "(iv)", "(v)", "(vi)"];
      function texToHtml(str) {
        if (!str) return "";
        var s = String(str).replace(/\\begin\{enumerate\}/g, "").replace(/\\end\{enumerate\}/g, "");
        var re = /\\item\[([^\]]*)\]|\\item(?![a-zA-Z])/g;
        var parts = [], last = 0, m, intro = s, items = [];
        var matches = [];
        while ((m = re.exec(s)) !== null) matches.push(m);
        if (matches.length) {
          intro = s.slice(0, matches[0].index);
          for (var k = 0; k < matches.length; k++) {
            var from = matches[k].index + matches[k][0].length;
            var to = (k + 1 < matches.length) ? matches[k + 1].index : s.length;
            items.push({ label: matches[k][1] || ROMAN[k] || "(" + (k + 1) + ")", body: s.slice(from, to) });
          }
        }
        var html = "";
        if (intro.trim()) html += "<div>" + renderInline(intro.trim()) + "</div>";
        if (items.length) {
          html += '<div class="sublist">' + items.map(function (it) {
            return '<div class="subitem"><span class="sublabel">' + escapeHtml(it.label) + '</span><div class="subbody">' + renderInline(it.body.trim()) + "</div></div>";
          }).join("") + "</div>";
        }
        return html || "<div>" + renderInline(s) + "</div>";
      }

      /* ================= 画面切り替え ================= */
      var views = ["home", "quiz", "result", "empty"];
      function show(name) {
        views.forEach(function (v) {
          document.getElementById("view-" + v).classList.toggle("hidden", v !== name);
        });
        window.scrollTo(0, 0);
      }

      /* ================= ホーム ================= */
      function weekStats(wi) {
        var w = DATA.weeks[wi], done = 0, ok = 0, weak = 0;
        w.questions.forEach(function (q, qi) {
          var mk = store.marks[qid(wi, qi)];
          if (mk) { done++; if (mk === "o") ok++; else weak++; }
        });
        return { done: done, ok: ok, weak: weak, total: w.questions.length };
      }
      function renderHome() {
        var doneAll = 0, okAll = 0, weakAll = 0;
        DATA.weeks.forEach(function (w, wi) {
          var st = weekStats(wi);
          doneAll += st.done; okAll += st.ok; weakAll += st.weak;
        });
        document.getElementById("st-done").textContent = doneAll;
        document.getElementById("st-bar").style.width = (doneAll / 143 * 100) + "%";
        document.getElementById("st-rate").textContent = doneAll ? Math.round(okAll / doneAll * 100) + "%" : "―";
        document.getElementById("st-weak").textContent = weakAll;
        var badge = document.getElementById("weak-badge");
        badge.textContent = weakAll + "問";
        badge.classList.toggle("hidden", weakAll === 0);
        document.getElementById("btn-weak").disabled = false;

        var grid = document.getElementById("week-grid");
        grid.innerHTML = "";
        DATA.weeks.forEach(function (w, wi) {
          var st = weekStats(wi);
          var sc = store.scores[w.week];
          var chip;
          if (sc) {
            chip = '<span class="score-chip' + (sc.score >= 100 ? " perfect" : "") + '">' + sc.score + "点</span>";
          } else {
            chip = '<span class="score-chip none">未挑戦</span>';
          }
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "week-card";
          btn.innerHTML =
            '<span class="wk-top"><span class="wk-num"><small>第</small>' + w.week + '<small>週</small></span>' + chip + "</span>" +
            '<span class="wk-topic" style="display:block">' + escapeHtml(w.topic) + "</span>" +
            '<span class="wk-title">' + escapeHtml(w.title) + "</span>" +
            '<span class="wk-bar" style="display:block"><i style="width:' + (st.done / st.total * 100) + '%"></i></span>' +
            '<span class="wk-meta"><span>' + st.done + " / " + st.total + " 問 完了</span>" +
            (st.weak ? '<span class="wk-weak">× ' + st.weak + "問</span>" : "<span></span>") + "</span>";
          btn.addEventListener("click", function () { startWeek(wi); });
          grid.appendChild(btn);
        });
      }

      /* ================= クイズ ================= */
      var quiz = null; // {mode, title, queue:[{wi,qi}], idx, results:[{wi,qi,mark}]}
      function shuffle(a) {
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
      }
      function startWeek(wi) {
        var w = DATA.weeks[wi];
        var queue = w.questions.map(function (q, qi) { return { wi: wi, qi: qi }; });
        quiz = { mode: "week", week: w.week, title: "第" + w.week + "週テスト", queue: queue, idx: 0, results: [] };
        showQuestion();
      }
      function startDrill() {
        var all = [];
        DATA.weeks.forEach(function (w, wi) {
          w.questions.forEach(function (q, qi) { all.push({ wi: wi, qi: qi }); });
        });
        shuffle(all);
        quiz = { mode: "drill", title: "ランダムドリル", queue: all.slice(0, 10), idx: 0, results: [] };
        showQuestion();
      }
      function startWeak() {
        var list = [];
        DATA.weeks.forEach(function (w, wi) {
          w.questions.forEach(function (q, qi) {
            if (store.marks[qid(wi, qi)] === "x") list.push({ wi: wi, qi: qi });
          });
        });
        if (!list.length) { show("empty"); return; }
        shuffle(list);
        quiz = { mode: "weak", title: "苦手だけ復習", queue: list, idx: 0, results: [] };
        showQuestion();
      }
      function showQuestion() {
        var item = quiz.queue[quiz.idx];
        var w = DATA.weeks[item.wi], q = w.questions[item.qi];
        document.getElementById("qp-title").textContent = quiz.title;
        document.getElementById("qp-now").textContent = quiz.idx + 1;
        document.getElementById("qp-total").textContent = quiz.queue.length;
        document.getElementById("qp-bar").style.width = (quiz.idx / quiz.queue.length * 100) + "%";
        document.getElementById("q-where").textContent = "第" + w.week + "週 ・ " + w.topic + " ・ 第" + (item.qi + 1) + "問";
        document.getElementById("q-points").textContent = q.points + "点";
        var prev = document.getElementById("q-prev");
        var pm = store.marks[qid(item.wi, item.qi)];
        if (pm) {
          prev.textContent = pm === "o" ? "前回：○" : "前回：×";
          prev.classList.remove("hidden");
        } else prev.classList.add("hidden");
        document.getElementById("q-body").innerHTML = texToHtml(q.q);
        document.getElementById("a-body").innerHTML = texToHtml(q.a);
        document.getElementById("answer-area").classList.add("hidden");
        document.getElementById("btn-reveal").classList.remove("hidden");
        document.getElementById("marked-note").innerHTML = "";
        show("quiz");
      }
      function mark(kind) {
        var item = quiz.queue[quiz.idx];
        store.marks[qid(item.wi, item.qi)] = kind;
        save();
        quiz.results.push({ wi: item.wi, qi: item.qi, mark: kind });
        var note = document.getElementById("marked-note");
        note.innerHTML = kind === "o" ? '<b class="ok">○ 正解</b> として記録しました' : '<b class="ng">× 不正解</b> として記録しました（苦手リストに入ります）';
        document.getElementById("qp-bar").style.width = ((quiz.idx + 1) / quiz.queue.length * 100) + "%";
        setTimeout(function () {
          quiz.idx++;
          if (quiz.idx < quiz.queue.length) showQuestion();
          else finishQuiz();
        }, 550);
      }
      function finishQuiz() {
        var gained = 0, totalPts = 0, okCount = 0;
        quiz.results.forEach(function (r) {
          var p = DATA.weeks[r.wi].questions[r.qi].points;
          totalPts += p;
          if (r.mark === "o") { gained += p; okCount++; }
        });
        if (quiz.mode === "week") {
          store.scores[quiz.week] = { score: gained, date: new Date().toISOString().slice(0, 10) };
          save();
        }
        document.getElementById("r-label").textContent = quiz.title + " の結果";
        var scoreHtml;
        if (quiz.mode === "week") {
          scoreHtml = '<span class="' + (gained >= 100 ? "perfect" : "") + '">' + gained + '</span><small> / 100点</small>';
        } else {
          scoreHtml = gained + '<small> / ' + totalPts + "点</small>";
        }
        document.getElementById("r-score").innerHTML = scoreHtml;
        document.getElementById("r-sub").textContent =
          quiz.results.length + "問中 " + okCount + "問 正解" +
          (quiz.mode === "week" ? " ・ この得点が週カードに記録されました" : "");
        var rev = document.getElementById("r-review");
        rev.innerHTML = "";
        quiz.results.forEach(function (r) {
          var w = DATA.weeks[r.wi], q = w.questions[r.qi];
          var div = document.createElement("div");
          div.className = "review-item";
          div.innerHTML =
            '<span class="review-mark ' + (r.mark === "o" ? "ok" : "ng") + '">' + (r.mark === "o" ? "○" : "×") + "</span>" +
            '<div class="review-q"><span class="q-tag">第' + w.week + "週 第" + (r.qi + 1) + "問（" + q.points + '点）</span><br />' + texToHtml(q.q) + "</div>" +
            '<div class="review-a">' + texToHtml(q.a) + "</div>";
          rev.appendChild(div);
        });
        show("result");
      }

      /* ================= イベント ================= */
      document.getElementById("btn-drill").addEventListener("click", startDrill);
      document.getElementById("btn-weak").addEventListener("click", startWeak);
      document.getElementById("btn-reveal").addEventListener("click", function () {
        document.getElementById("answer-area").classList.remove("hidden");
        document.getElementById("btn-reveal").classList.add("hidden");
      });
      document.getElementById("btn-ok").addEventListener("click", function () { mark("o"); });
      document.getElementById("btn-ng").addEventListener("click", function () { mark("x"); });
      document.getElementById("btn-quit").addEventListener("click", function () { quiz = null; renderHome(); show("home"); });
      document.getElementById("btn-home").addEventListener("click", function () { renderHome(); show("home"); });
      document.getElementById("btn-empty-home").addEventListener("click", function () { renderHome(); show("home"); });
      document.getElementById("btn-again").addEventListener("click", function () {
        if (!quiz) { renderHome(); show("home"); return; }
        if (quiz.mode === "week") {
          var wi = DATA.weeks.findIndex(function (w) { return w.week === quiz.week; });
          startWeek(wi);
        } else if (quiz.mode === "drill") startDrill();
        else startWeak();
      });
      var resetArmed = false, resetTimer = null;
      document.getElementById("btn-reset").addEventListener("click", function () {
        var btn = this;
        if (!resetArmed) {
          resetArmed = true;
          btn.textContent = "本当にすべての記録を消しますか？（もう一度押すと実行）";
          btn.classList.add("confirm");
          resetTimer = setTimeout(function () {
            resetArmed = false;
            btn.textContent = "記録をすべてリセット";
            btn.classList.remove("confirm");
          }, 4000);
          return;
        }
        clearTimeout(resetTimer);
        resetArmed = false;
        store = { marks: {}, scores: {} };
        save();
        btn.textContent = "記録をすべてリセット";
        btn.classList.remove("confirm");
        renderHome();
      });

      renderHome();
      show("home");
    </script>
  </body>
</html>
